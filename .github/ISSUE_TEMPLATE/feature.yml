name: 功能建议
description: 描述希望解决的实际使用问题
title: "[建议] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 遇到了什么问题？
      description: 请说明具体使用场景、现在如何处理，以及希望改善什么。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 你的建议
      description: 可以描述希望的操作方式或提供不含敏感信息的示例。
